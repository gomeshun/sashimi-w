name: itamae-migration

on:
  push:
    branches: [itamae-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned public ITAMAE
        uses: actions/checkout@v4
        with:
          repository: gomeshun/itamae
          ref: a557a0d975b284c9fc3fe9697746e4847783653b
          path: .itamae
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - name: Install migration dependencies
        run: uv pip install ./.itamae "astropy>=6" "pytest>=8"
      - name: Run ITAMAE migration regression tests
        run: uv run --no-sync python -m pytest -q --junitxml=test-results.xml
      - name: Upload migration test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-results-${{ matrix.python-version }}
          path: test-results.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned public ITAMAE
        uses: actions/checkout@v4
        with:
          repository: gomeshun/itamae
          ref: a557a0d975b284c9fc3fe9697746e4847783653b
          path: .itamae
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: uv build
      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.11 .venv-smoke
          uv pip install --python .venv-smoke/bin/python ./.itamae
          uv pip install --python .venv-smoke/bin/python --no-deps dist/*.whl
      - name: Smoke-test legacy and opt-in imports outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv-smoke/bin/python" -c "import sashimi_w; assert sashimi_w.subhalos"
          "$GITHUB_WORKSPACE/.venv-smoke/bin/python" -c "import sashimi_w_itamae, sashimi_w_itamae_migration, sashimi_w_itamae_variance; assert sashimi_w_itamae.subhalos"
          "$GITHUB_WORKSPACE/.venv-smoke/bin/python" -c "import importlib.util; assert importlib.util.find_spec('itamae_migration') is None; assert importlib.util.find_spec('itamae_variance') is None"
